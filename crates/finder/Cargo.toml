[package]
name = "finder"
version = "0.1.0"
edition = "2021"

# The card finder: a small Leptos widget compiled to WebAssembly. It mounts inside the server-built /all and /search pages.
[lib]
crate-type = ["cdylib"]

[dependencies]
vault-search = { path = "../vault-search" }
leptos = { version = "=0.8.23", features = ["csr"] }
# Pinned: this must equal the wasm-bindgen command-line tool used in the build (see Dockerfile and build-wasm.sh).
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob", "CustomEvent", "Document", "Element", "Event", "EventTarget", "History", "HtmlElement", "HtmlFormElement",
    "HtmlInputElement", "HtmlImageElement", "Location", "Navigator", "Request", "RequestInit", "Response", "UrlSearchParams", "Window",
] }
