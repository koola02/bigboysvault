[workspace]
members = [".", "crates/vault-search", "crates/finder"]
default-members = ["."]
resolver = "2"

[package]
name = "marcuru-rs"
version = "0.1.0"
edition = "2021"
default-run = "marcuru-rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "fs", "set-header", "trace"] }
askama = "0.16"
rusqlite = { version = "0.41", features = ["bundled"] }
moka = { version = "0.12", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vault-search = { path = "crates/vault-search" }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The browser widget: smallest possible download.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
