{% extends "base.html" %}
{% block layout %}wide{% endblock %}
{% block content %}
{% if crate::look::is_new() %}<p class="mk-top"><a class="btn ghost sm" href="/all">‹ Marketplace</a><button type="button" class="btn soft sm staff-only" data-full-only data-card-edit data-id="{{ p.id }}" data-price="{{ p.price }}" data-cond="{{ p.variant }}" data-notes="{{ p.notes() }}" data-tags="{% for t in p.tag_list() %}{% if crate::db::tag_for_people(t) %}{{ t }}, {% endif %}{% endfor %}" data-copies="{{ copies }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Edit</button></p>{% endif %}
{% include "product_body.html" %}
<script>
// Count a view when the page is really seen, not when the browser prepared it in advance.
(function () { function seen() { if (navigator.sendBeacon) navigator.sendBeacon("/hit/{{ p.id }}"); }
  if (document.prerendering) document.addEventListener("prerenderingchange", seen, { once: true }); else seen(); })();
</script>
<script type="module" src="/static/holo.js?v=6"></script>
<script type="module" src="/static/card-lang.js?v=4"></script>
{% if crate::look::is_new() %}<script src="/static/edit-card.js?v=1" defer></script>{% endif %}
{% endblock %}
