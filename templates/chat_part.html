<section class="chat" data-chat data-card-title="Vault chat">
  <header class="chat-head">
    <h1 class="h1">Vault chat</h1>
    <p class="chat-live" aria-live="off"><i aria-hidden="true"></i><span data-online>Connecting</span></p>
  </header>
  <div class="chat-log" data-log role="log" aria-label="Messages" tabindex="0">
    <button type="button" class="linkbtn chat-older" data-older hidden>Show earlier messages</button>
    <div data-list></div>
  </div>
  <button type="button" class="chat-new" data-new hidden>New messages ↓</button>
  <form class="chat-form" data-form hidden>
    <textarea data-text rows="1" maxlength="500" placeholder="Say something to the vault" aria-label="Your message" enterkeyhint="send"></textarea>
    <button class="btn chat-send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg><span>Send</span></button>
  </form>
  <p class="chat-note" data-note hidden></p>
  <div class="chat-join" data-join hidden>
    <p>Everyone can read along. Become a trainer to join in. It takes a few seconds and there's no email.</p>
    <a class="btn" href="/join">Become a trainer</a>
    <a class="linkbtn" href="/join?signin=1">Sign in</a>
  </div>
</section>
