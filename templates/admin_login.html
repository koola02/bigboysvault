{% extends "base.html" %}
{% block title %}Admin · {{ nav.brand }}{% endblock %}
{% block content %}
<section class="wrap narrow">
  <h1 class="h1">Admin</h1>
  <p class="sub">Enter your admin token to add and edit cards.</p>
  {% if error %}<p class="err">That token isn’t right.</p>{% endif %}
  <form method="post" action="/admin/login" class="form step">
    <input type="password" name="token" placeholder="Admin token" autocomplete="current-password" autofocus required>
    <button class="btn" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
