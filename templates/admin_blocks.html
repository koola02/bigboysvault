{% for b in blocks %}
<li class="blk{% if !b.visible %} off{% endif %}" data-id="{{ b.id }}" data-kind="{{ b.kind }}" data-json="{{ b.json }}">
  <button class="drag" type="button" data-drag aria-label="Drag to move this section" title="Drag to move">⠿</button>
  <div class="blk-main"><span class="blk-kind">{{ b.label }}</span><span class="blk-sum">{{ b.summary }}</span>{% if !b.visible %}<span class="blk-off">Hidden</span>{% endif %}</div>
  <div class="blk-acts">
    <button class="ibtn" type="button" data-act="up" aria-label="Move up" title="Move up" {% if b.first %}disabled{% endif %}>↑</button>
    <button class="ibtn" type="button" data-act="down" aria-label="Move down" title="Move down" {% if b.last %}disabled{% endif %}>↓</button>
    {% if b.editable %}<button class="pbtn" type="button" data-act="edit">Edit</button>{% endif %}
    <button class="pbtn" type="button" data-act="vis">{% if b.visible %}Hide{% else %}Show{% endif %}</button>
    <button class="pbtn danger" type="button" data-act="del">Delete</button>
  </div>
</li>
{% endfor %}
