<section class="ask" data-ask data-card-title="Ask the Vault">
  <header class="chat-head">
    <img class="ask-orb" src="/static/img/logo-sm.png" width="52" height="52" alt="">
    <div><h1 class="h1">Ask the Vault</h1><p class="ask-sub">I answer from the vault's live cards and prices.</p></div>
  </header>
  <div class="chat-log ask-log" data-log role="log" aria-label="Answers" tabindex="0"></div>
  <div class="ask-chips" data-chips></div>
  <form class="chat-form" data-form>
    <input data-text type="text" maxlength="200" placeholder="Ask for a card or a budget" aria-label="Your question" autocomplete="off" enterkeyhint="send">
    <button class="btn chat-send" type="submit" aria-label="Ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg><span>Ask</span></button>
  </form>
</section>
