{#- One binder on a store page (new look), `t` a store::BinderTile: a seller's binder, or one of the vault's own. -#}
<li><a class="sf-btile" href="{{ t.href }}"{% if t.off %} data-off{% endif %}><span class="sf-bcov{% if t.photo %} sf-bphoto{% endif %}" data-n="{{ t.pics.len() }}">{% for p in t.pics %}<img src="{{ p }}" width="245" height="342" alt="" loading="lazy" decoding="async">{% endfor %}{% if t.pics.is_empty() %}<svg class="sf-bnone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 4v10"/></svg>{% endif %}</span><span class="sf-btxt"><b class="sf-bname">{{ t.title }}</b><small>{{ t.words }}</small></span></a></li>
