<style>

  .gc b { display:block; font-weight:600; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; } .gc small { color:var(--m-muted); font-weight:600; }
  .m-foot { position:relative; z-index:2; padding:22px 28px 26px; font-size:12.5px; color:var(--m-muted); display:flex; justify-content:space-between; }
  @media (max-width:760px) { .m-stats, .m-row { grid-template-columns:repeat(2,1fr); } .m-binders { grid-template-columns:repeat(2,1fr); } .m-links { display:none; } .m-search { flex:1; } }

  /* ================= theme tokens ================= */

 { n: 'Sticker Sheet', cls: 't9', concept: 'Everything is a die-cut sticker: thick white outline and ink shadow on the characters, tilted cards, a round count sticker and tape. Friendly and busy, all copy still literal.',

function mock(t) { return `<div class="mock ${t.cls}">${nav()}${t.body(t)}${foot()}</div>`; }
function render() {
  document.getElementById('jump').innerHTML = T.map((t, i) => `<li><a href="#t${i + 1}">${String(i + 1).padStart(2, '0')} ${t.n}</a></li>`).join('');
  document.getElementById('out').innerHTML = T.map((t, i) => `
    <section class="theme" id="t${i + 1}">
      <div class="theme-h"><span class="num">${String(i + 1).padStart(2, '0')}</span><h2>${t.n}</h2></div>
      <p class="concept">${t.concept}</p>
      <div class="grid">
        ${mock(t)}
        <dl class="spec">
          <dt>Palette</dt><dd><div class="sw">${t.sw.map((c) => `<i style="background:${c}" title="${c}"></i>`).join('')}</div></dd>
          <dt>Type</dt><dd>${t.type}</dd>
          <dt>Copy</dt><dd>${t.say.map((s) => `<em class="say">“${s}”</em>`).join('')}</dd>
          <dt>Art &amp; illustration</dt><dd>${t.art}</dd>
          <dt>Motion</dt><dd>${t.motion}</dd>
        </dl>
      </div>
    </section>`).join('');
}
// Real cards from your collection, so every mock shows real photos.
(async () => {
  const names = ['pikachu', 'charizard', 'greninja', 'mew', 'eevee', 'gengar', 'umbreon', 'lugia', 'rayquaza', 'mewtwo', 'snorlax', 'blastoise'];
  try {
    const res = await Promise.all(names.map((n) => fetch('/suggest?q=' + n).then((r) => r.json()).catch(() => ({ cards: [] }))));
    CARDS = res.flatMap((j) => j.cards || []).filter((c) => c.img).map((c) => ({ ...c, img: c.img.replace('width=120', 'width=420') }));
  } catch (_) {}
  render();
})();
render();
</script>
